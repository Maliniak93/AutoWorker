name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Add the application's format/build/test steps here once the first architecture spec picks a stack.
      - run: node --test "scripts/*.test.mjs"
